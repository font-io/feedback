name: Data correction
description: Something on a font.io page is factually wrong
title: "Data correction: "
labels: ["data-correction", "needs-verification"]
body:
  - type: input
    id: page
    attributes:
      label: font.io page
      description: The page with the error
      placeholder: https://font.io/fonts/123-example
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: What is wrong?
      description: The value or statement as it appears now
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: What should it say?
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source
      description: A link or reference that supports the correction
      placeholder: https://
    validations:
      required: false
